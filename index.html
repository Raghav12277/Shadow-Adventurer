<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shadow Runner - Endless Adventure</title>
    
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="stat">
                <span class="stat-icon">💰</span>
                <span id="score">0</span>
            </div>
            <div class="stat">
                <span class="stat-icon">❤️</span>
                <span id="lives">3</span>
            </div>
            <div class="stat">
                <span class="stat-icon">⏱️</span>
                <span id="time">0:00</span>
            </div>
        </div>

        <div id="warningMessage">DRAGONS APPROACHING!</div>

        <div id="gestureHint">Tap to Jump • Swipe Down to Fall</div>

        <!-- Mobile Controls -->
        <div id="mobileControls">
            <div class="control-btn" id="btnJump">⬆️</div>
            <div class="control-btn" id="btnFall">⬇️</div>
            <div class="control-btn" id="btnAttack">⚔️</div>
        </div>

        <div id="startScreen">
            <h1>SHADOW RUNNER</h1>
            <p class="subtitle">Endless Adventure Awaits</p>
            <button class="btn btn-start" id="startBtn">Start Game</button>
            <div class="controls-info">
                <b>Desktop:</b> <span>SPACE/↑</span> Jump • <span>↓</span> Fall • <span>Z/X</span> Attack<br>
                <b>Mobile:</b> Tap/Buttons to Jump • Swipe Down to Fall • Attack Button
            </div>
        </div>

        <div id="gameOverScreen">
            <h1>GAME OVER</h1>
            <div class="final-score">Score: <span id="finalScore">0</span></div>
            <button class="btn btn-restart" id="restartBtn">Play Again</button>
        </div>
    </div>

<script src="game.js"></script>
</body>
  </html>
